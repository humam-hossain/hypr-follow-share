<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- hypr-follow-share: an ultrawide screen with a 16:9 share frame following the cursor.
       Content stays inside a centered circle: some notification servers crop icons round. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e5364b"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <!-- ultrawide monitor -->
  <rect x="10" y="22" width="44" height="19" rx="3" fill="#2a1420" fill-opacity="0.35" stroke="#fff" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="29" y="43" width="6" height="3" fill="#fff" fill-opacity="0.6"/>
  <rect x="24" y="46" width="16" height="2.5" rx="1.25" fill="#fff" fill-opacity="0.6"/>
  <!-- 16:9 share frame (corner brackets) -->
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 19 h-5 v4.5"/>
    <path d="M39 19 h5 v4.5"/>
    <path d="M25 44 h-5 v-4.5"/>
    <path d="M39 44 h5 v-4.5"/>
  </g>
  <!-- cursor -->
  <path d="M29.5 25 L29.5 37.5 L32.6 34.6 L35 39.6 L37.3 38.6 L34.9 33.6 L39.2 33.2 Z" fill="#fff" stroke="#2a1420" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
