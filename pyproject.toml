[project]
name = "hypr-follow-share"
version = "0.1.0"
description = "Share a cursor-following 16:9 crop of an ultrawide Hyprland monitor through OBS and a virtual monitor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets>=13"]

[project.scripts]
hfs = "hfs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hfs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
